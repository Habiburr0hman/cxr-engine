project:
  experiment_name: "cnn-medical-classification"
  tracking_mode: "dagshub"
  artifact_dir: "artifacts"

mlflow:
  local:
    tracking_uri: "sqlite:///mlflow.db"
  dagshub:
    tracking_uri: "https://dagshub.com/Habiburr0hman/cxr-engine.mlflow"

data:
  catalog_path: "data/metadata/kermany_2018/catalog.csv"
  variant: "clahe_resized"
  image_height: 256
  image_width: 256
  channels: 1
  batch_size: 32
  val_split: 0.15
  test_split: 0.15

model:
  variant: "separable_resnet"

training:
  epochs: 1
  learning_rate: 0.001